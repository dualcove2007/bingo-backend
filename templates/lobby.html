<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Sala de Espera</title>
    <style>
        /* Reset de estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19; 
            min-height: 100vh;
            display: flex;
            color: #ffffff;
            overflow: hidden;
        }

        /* --- BARRA LATERAL (SIDEBAR) --- */
        .sidebar {
            width: 240px;
            background-color: #1a2238; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            padding-left: 10px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #b5ff60; 
        }

        .nav-item.inactive {
            color: #5d6b89;
        }

        .nav-item.inactive:hover {
            color: #ffffff;
            background-color: #232d4a;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: #5d6b89;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            color: #ff6b6b;
            background-color: #232d4a;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #161d31;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #232d4a;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ffb800; /* Amarillo inicial "Conectando" */
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #ffb800;
            letter-spacing: 0.5px;
        }

        .lobby-card {
            background-color: #161d31;
            border: 1px solid #1f2842;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .lobby-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .lobby-description {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Contenedor dinámico de la lista de jugadores conectados */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            background: #0b0f19;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2842;
            max-height: 180px;
            overflow-y: auto;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .player-row .dot {
            width: 6px;
            height: 6px;
            background-color: #b5ff60;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(0.9);
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo">BINGO</div>
            
            <nav>
                <ul class="nav-menu">
                    <li>
                        <a href="/menu" class="nav-item active">
                            <span>🎮</span> Jugar en Línea
                        </a>
                    </li>
                    <li>
                        <a href="/opciones" class="nav-item inactive">
                            <span>⚙️</span> Opciones
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div id="logoutBtn" class="logout-btn">
            <span>🚪</span> Cerrar Sesión
        </div>
    </aside>

    <main class="main-content">
        
        <div class="status-container">
            <div id="statusDot" class="status-dot"></div>
            <h2 id="statusText" class="status-text">Conectando al servidor...</h2>
        </div>
        
        <div class="lobby-card">
            <h3 id="lobbyCount" class="lobby-title">Jugadores en la sala: 0</h3>
            <p class="lobby-description">
                La partida iniciará automáticamente cuando se complete el cupo de jugadores en la sala de espera.
            </p>

            <div class="players-list" id="playersList">
                <p style="color: #566488; text-align: center; font-size: 13px;">Buscando otros jugadores...</p>
            </div>
        </div>
        
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playerName = localStorage.getItem('player_name') || "Jugador_Anonimo";
            const sanitizedName = playerName.trim().replace(/\s+/g, '_');

            // Manejo del Logout
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = "/";
            });

            // Configuración base de URLs dinámicas
            const loc = window.location;
            let wsUri = loc.protocol === "https:" ? "wss://" : "ws://";
            wsUri += loc.host + "/ws/lobby/" + sanitizedName;

            console.log("Intentando conectar canal WebSocket en: ", wsUri);

            let socket;
            let pingInterval; // Guardará el temporizador del latido

            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const lobbyCount = document.getElementById('lobbyCount');
            const playersList = document.getElementById('playersList');

            function conectarWebSocket() {
                socket = new WebSocket(wsUri);

                // Cuando se abre la conexión con éxito
                socket.onopen = () => {
                    console.log("✅ Conexión establecida con éxito.");
                    statusDot.style.backgroundColor = "#b5ff60"; // Verde neón definitivo
                    statusText.style.color = "#b5ff60";
                    statusText.innerText = "Conexión Segura Establecida";

                    // 🔥 LATIDO ANTIDESTRUCCIÓN DE RENDER:
                    // Enviamos un "PING" al backend cada 10 segundos para que Render no asuma inactividad.
                    if (pingInterval) clearInterval(pingInterval);
                    pingInterval = setInterval(() => {
                        if (socket.readyState === WebSocket.OPEN) {
                            socket.send("PING");
                            console.log("🛰️ Enviando PING de mantenimiento a Render...");
                        }
                    }, 10000);
                };

                // Cuando el backend nos envía datos de la sala en tiempo real
                socket.onmessage = (event) => {
                    // Ignorar respuestas vacías o ecos de control si existiesen
                    if (event.data === "PONG") return;

                    try {
                        const data = JSON.parse(event.data);

                        // Si recibimos una actualización de la lista de jugadores
                        if (data.tipo === "actualizacion_sala") {
                            const listaHtml = data.jugadores.map(p => `
                                <div class="player-row">
                                    <span class="dot"></span>
                                    <span>${p.replace(/_/g, ' ')}</span>
                                </div>
                            `).join('');
                            
                            playersList.innerHTML = listaHtml;
                            lobbyCount.innerText = `Jugadores en la sala: ${data.total}`;
                        }

                        // Si el servidor da la orden de arrancar la partida
                        if (data.action === "START_GAME") {
                            if (pingInterval) clearInterval(pingInterval);
                            alert("¡Sala llena, mano! La partida comienza ya.");
                            window.location.href = "/juego";
                        }
                    } catch (e) {
                        console.error("Error parseando JSON del servidor: ", e);
                    }
                };

                // Si se cae la conexión o Render parpadea
                socket.onclose = () => {
                    console.warn("⚠️ WebSocket cerrado. Limpiando intervalos...");
                    if (pingInterval) clearInterval(pingInterval);

                    statusDot.style.backgroundColor = "#ff6b6b"; // Rojo error
                    statusText.style.color = "#ff6b6b";
                    statusText.innerText = "Desconectado de la sala";

                    // 🔥 RECONEXIÓN AUTOMÁTICA DE EMERGENCIA
                    console.log("🔄 Intentando reconexión en 3 segundos...");
                    setTimeout(conectarWebSocket, 3000);
                };

                socket.onerror = (error) => {
                    console.error("❌ Error detectado en WebSocket:", error);
                    socket.close(); // Forzamos el cierre para activar la reconexión limpia
                };
            }

            // Inicializar la conexión apenas cargue el DOM
            conectarWebSocket();
        });
    </script>

</body>
</html>
